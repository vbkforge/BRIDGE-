name: Build Bridge APK

on:
  push:
    paths-ignore:
      - "README.md"
      - "relay/**"
      - ".github/workflows/deploy-relay.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK on the Releases page

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use custom signing key if you added one (optional)
        env:
          KEYSTORE_B64: ${{ secrets.BRIDGE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/custom.keystore"
            echo "BRIDGE_KEYSTORE_FILE=$RUNNER_TEMP/custom.keystore" >> "$GITHUB_ENV"
            echo "Using custom signing key from secrets."
          else
            echo "Using the built-in signing key."
          fi

      - name: Build APK
        env:
          BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.BRIDGE_KEYSTORE_PASSWORD }}
          BRIDGE_KEY_ALIAS: ${{ secrets.BRIDGE_KEY_ALIAS }}
          BRIDGE_KEY_PASSWORD: ${{ secrets.BRIDGE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Bridge-${GITHUB_RUN_NUMBER}.apk"
          ls -l Bridge-*.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Bridge-${{ github.run_number }}
          path: Bridge-*.apk
          if-no-files-found: error

      - name: Publish APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "Bridge-${GITHUB_RUN_NUMBER}.apk" \
            --target "$GITHUB_SHA" \
            --title "Bridge build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Built from commit ${GITHUB_SHA::7} on branch ${GITHUB_REF_NAME}. Download the .apk file below and open it to install." \
            --latest
